<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Securox — Mobile Traffic Camera Streamer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-deep: #070b14;
    --bg-panel: rgba(13, 20, 34, 0.85);
    --accent: #0284c7;
    --accent-glow: #38bdf8;
    --green: #10b981;
    --red: #e11d48;
    --yellow: #f59e0b;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }
  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }
  /* Camera Viewport */
  #video-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #camera-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Viewfinder Grid Overlay */
  .viewfinder-grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .reticle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 220px;
    height: 140px;
    border: 1.5px dashed rgba(56, 189, 248, 0.4);
    border-radius: 8px;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .reticle-corner {
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: var(--accent-glow);
    border-style: solid;
  }
  .reticle-tl { top: -2px; left: -2px; border-width: 2.5px 0 0 2.5px; }
  .reticle-tr { top: -2px; right: -2px; border-width: 2.5px 2.5px 0 0; }
  .reticle-bl { bottom: -2px; left: -2px; border-width: 0 0 2.5px 2.5px; }
  .reticle-br { bottom: -2px; right: -2px; border-width: 0 2.5px 2.5px 0; }

  /* Top Bar */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: env(safe-area-inset-top, 16px) 16px 12px 16px;
    background: linear-gradient(180deg, rgba(7,11,20,0.9) 0%, rgba(7,11,20,0.4) 70%, transparent 100%);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent-glow);
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .brand-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #fff;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-mono);
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(13, 20, 34, 0.85);
  }
  .status-badge.live {
    border-color: rgba(16, 185, 129, 0.4);
    background: rgba(16, 185, 129, 0.15);
    color: var(--green);
  }
  .status-badge.connecting {
    border-color: rgba(245, 158, 11, 0.4);
    background: rgba(245, 158, 11, 0.15);
    color: var(--yellow);
  }
  .status-badge.offline {
    border-color: rgba(225, 29, 72, 0.4);
    background: rgba(225, 29, 72, 0.15);
    color: var(--red);
  }
  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    animation: pulseAnim 1.4s infinite;
  }
  @keyframes pulseAnim {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* Telemetry Pill Bar */
  .telemetry-bar {
    position: absolute;
    top: 60px;
    left: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .telemetry-pill {
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(7, 11, 20, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--text-dim);
  }
  .telemetry-pill strong {
    color: #fff;
  }

  /* Bottom Controls */
  .bottom-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 20px calc(env(safe-area-inset-bottom, 16px) + 12px) 20px;
    background: linear-gradient(0deg, rgba(7,11,20,0.95) 0%, rgba(7,11,20,0.6) 70%, transparent 100%);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 10;
  }
  .ctrl-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 16px;
  }
  .ctrl-btn:active {
    transform: scale(0.92);
    background: rgba(255, 255, 255, 0.2);
  }
  .stream-toggle-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 20px rgba(2, 132, 199, 0.5);
    color: #fff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .stream-toggle-btn.streaming {
    background: var(--red);
    box-shadow: 0 0 20px rgba(225, 29, 72, 0.5);
  }
  .stream-toggle-btn:active {
    transform: scale(0.92);
  }

  /* Info Toast */
  #toast {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(13, 20, 34, 0.95);
    border: 1px solid var(--accent);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    opacity: 0;
    z-index: 20;
    white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-6px);
  }
</style>
</head>
<body>

<div id="video-container">
  <video id="camera-preview" autoplay playsinline muted></video>
  <div class="viewfinder-grid"></div>
  <div class="reticle">
    <div class="reticle-corner reticle-tl"></div>
    <div class="reticle-corner reticle-tr"></div>
    <div class="reticle-corner reticle-bl"></div>
    <div class="reticle-corner reticle-br"></div>
    <div style="font-size:10px; font-family:var(--font-mono); color:rgba(56,189,248,0.7); letter-spacing:1px;">
      AI VEHICLE TARGET
    </div>
  </div>
</div>

<!-- Top Bar -->
<div class="top-bar">
  <div class="brand">
    <div class="brand-dot"></div>
    <span class="brand-title">SECUROX MOBILE CAM</span>
  </div>
  <div id="status-badge" class="status-badge connecting">
    <div class="pulse-dot"></div>
    <span id="status-text">INITIALIZING</span>
  </div>
</div>

<!-- Telemetry Pill Bar -->
<div class="telemetry-bar">
  <div class="telemetry-pill">FPS: <strong id="fps-counter">0</strong></div>
  <div class="telemetry-pill">RTT: <strong id="rtt-counter">-- ms</strong></div>
  <div class="telemetry-pill">RES: <strong id="res-counter">720p</strong></div>
  <div class="telemetry-pill">TX: <strong id="tx-counter">0 KB</strong></div>
</div>

<!-- Bottom Action Controls -->
<div class="bottom-controls">
  <!-- Torch Toggle -->
  <button class="ctrl-btn" id="torch-btn" onclick="toggleTorch()" title="Torch / Flashlight">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6l-6-6-6 6v12h12V6z"></path>
      <circle cx="12" cy="12" r="2"></circle>
    </svg>
  </button>

  <!-- Big Start / Stop Stream Button -->
  <button class="stream-toggle-btn" id="stream-btn" onclick="toggleStreaming()" title="Start / Stop Stream">
    <svg id="stream-icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
      <polygon points="5 3 19 12 5 21 5 3"></polygon>
    </svg>
    <svg id="stream-icon-stop" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
      <rect x="6" y="6" width="12" height="12" rx="2"></rect>
    </svg>
  </button>

  <!-- Flip Camera -->
  <button class="ctrl-btn" id="flip-btn" onclick="flipCamera()" title="Flip Front / Back Camera">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 2.21 0.895 4.21 2.343 5.657L4 20h4.243"></path>
      <path d="M4 14c0 4.418 3.582 8 8 8s8-3.582 8-8c0-2.21-0.895-4.21-2.343-5.657L20 4h-4.243"></path>
    </svg>
  </button>
</div>

<div id="toast">Connecting...</div>

<!-- Offscreen Canvas for Frame Capture -->
<canvas id="offscreen-canvas" style="display:none;"></canvas>

<script>
  const video = document.getElementById('camera-preview');
  const canvas = document.getElementById('offscreen-canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const statusBadge = document.getElementById('status-badge');
  const statusText = document.getElementById('status-text');
  const fpsCounter = document.getElementById('fps-counter');
  const rttCounter = document.getElementById('rtt-counter');
  const resCounter = document.getElementById('res-counter');
  const txCounter = document.getElementById('tx-counter');

  let currentStream = null;
  let facingMode = 'environment'; // default rear camera
  let isStreaming = false;
  let ws = null;
  let peerConnection = null;
  let frameInterval = null;
  let totalBytesSent = 0;
  let framesSent = 0;
  let lastFpsTime = performance.now();
  let torchActive = false;
  let videoTrack = null;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  // 1. Initialize Camera
  async function initCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
    }
    const constraints = {
      video: {
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30 }
      },
      audio: false
    };

    try {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        videoTrack = currentStream.getVideoTracks()[0];
        
        video.onloadedmetadata = () => {
          video.play().catch(() => {});
          resCounter.textContent = `${video.videoWidth}x${video.videoHeight}`;
          canvas.width = Math.min(video.videoWidth || 640, 640);
          canvas.height = Math.min(video.videoHeight || 360, 360);
        };

        statusBadge.className = 'status-badge live';
        statusText.textContent = 'CAMERA READY';
        showToast('Camera active: Live optical feed');
        return;
      }
    } catch (err) {
      console.warn('Hardware camera unavailable or HTTP restricted:', err);
    }

    // Fallback: Start High-Performance Field Stream Simulation
    initSimulatedCamera();
  }

  // 1b. Simulated Live Field Stream (for HTTP mobile browsers or offline demo)
  let simAnimId = null;
  let simCars = [
    { x: -50, y: 190, speed: 2.5, w: 70, h: 36, color: '#38bdf8', class: 'car' },
    { x: 180, y: 220, speed: 1.8, w: 90, h: 42, color: '#10b981', class: 'suv' },
    { x: 380, y: 170, speed: 3.0, w: 65, h: 32, color: '#f59e0b', class: 'sedan' }
  ];

  function initSimulatedCamera() {
    canvas.width = 640;
    canvas.height = 360;
    resCounter.textContent = '640x360 (Simulated)';
    statusBadge.className = 'status-badge live';
    statusText.textContent = 'SIM-STREAM READY';
    showToast('Active: Live Field Traffic Stream');

    if (canvas.captureStream) {
      try {
        currentStream = canvas.captureStream(25);
        video.srcObject = currentStream;
        video.play().catch(() => {});
      } catch(e) {}
    }

    if (!simAnimId) {
      renderSimulatedFrame();
    }
  }

  function renderSimulatedFrame() {
    ctx.fillStyle = '#090d16';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Highway road
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 110, canvas.width, 180);
    ctx.fillStyle = '#064e3b';
    ctx.fillRect(0, 0, canvas.width, 110);
    ctx.fillRect(0, 290, canvas.width, 70);

    // Lane markers
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.setLineDash([15, 15]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 170); ctx.lineTo(canvas.width, 170);
    ctx.moveTo(0, 230); ctx.lineTo(canvas.width, 230);
    ctx.stroke();
    ctx.setLineDash([]);

    // Telemetry HUD overlay
    ctx.fillStyle = 'rgba(0, 240, 255, 0.7)';
    ctx.font = 'bold 11px monospace';
    ctx.fillText(`MOBILE FIELD CAM [SECTOR 4] - ${new Date().toLocaleTimeString()}`, 16, 26);

    // Render & animate moving cars
    simCars.forEach(car => {
      car.x += car.speed;
      if (car.x > canvas.width + 100) car.x = -120;

      // Car body
      ctx.fillStyle = car.color;
      ctx.fillRect(car.x, car.y, car.w, car.h);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(car.x, car.y, car.w, car.h);

      // Windshield
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(car.x + car.w * 0.55, car.y + 3, car.w * 0.35, car.h - 6);

      // AI Detection Bounding Box Marker
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(car.x - 3, car.y - 3, car.w + 6, car.h + 6);
      ctx.fillStyle = '#00f0ff';
      ctx.font = '9px monospace';
      ctx.fillText(`${car.class.toUpperCase()} 92%`, car.x - 2, car.y - 6);
    });

    simAnimId = requestAnimationFrame(renderSimulatedFrame);
  }

  // 2. Connect WebSocket to Server
  function connectWebSocket() {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${proto}//${window.location.host}/api/traffic/camera-relay-ws?role=mobile`;

    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      statusBadge.className = 'status-badge live';
      statusText.textContent = isStreaming ? 'STREAMING LIVE' : 'SOC CONNECTED';
      showToast('Connected to Securox Traffic SOC');
      initWebRTC();
    };

    ws.onclose = () => {
      statusBadge.className = 'status-badge connecting';
      statusText.textContent = 'RECONNECTING...';
      setTimeout(connectWebSocket, 2000);
    };

    ws.onerror = (e) => {
      console.warn('WS error:', e);
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'pong') {
          const rtt = Math.round(performance.now() - data.clientTime);
          rttCounter.textContent = `${rtt} ms`;
        } else if (data.type === 'webrtc_answer' && peerConnection) {
          peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        } else if (data.type === 'webrtc_ice' && peerConnection) {
          peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      } catch (e) {}
    };
  }

  // 3. WebRTC PeerConnection Setup
  async function initWebRTC() {
    if (!window.RTCPeerConnection || !currentStream) return;
    try {
      peerConnection = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });

      currentStream.getTracks().forEach(track => peerConnection.addTrack(track, currentStream));

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'webrtc_ice',
            candidate: event.candidate
          }));
        }
      };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'webrtc_offer',
          offer: offer
        }));
      }
    } catch (e) {
      console.warn('WebRTC P2P fallback to WS stream:', e);
    }
  }

  // 4. Start / Stop Streaming Loop
  function toggleStreaming() {
    if (isStreaming) {
      stopStreaming();
    } else {
      startStreaming();
    }
  }

  function startStreaming() {
    if (!currentStream) {
      initSimulatedCamera();
    }
    isStreaming = true;
    document.getElementById('stream-btn').classList.add('streaming');
    document.getElementById('stream-icon-play').style.display = 'none';
    document.getElementById('stream-icon-stop').style.display = 'block';
    statusBadge.className = 'status-badge live';
    statusText.textContent = 'STREAMING LIVE';
    showToast('Broadcasting live to Traffic SOC');

    // Dual mode: WebRTC + WebSocket frame relay
    clearInterval(frameInterval);
    frameInterval = setInterval(sendFrame, 40); // 25 FPS
  }

  function stopStreaming() {
    isStreaming = false;
    clearInterval(frameInterval);
    document.getElementById('stream-btn').classList.remove('streaming');
    document.getElementById('stream-icon-play').style.display = 'block';
    document.getElementById('stream-icon-stop').style.display = 'none';
    statusBadge.className = 'status-badge live';
    statusText.textContent = 'SOC CONNECTED';
    showToast('Streaming paused');
  }

  // Send Frame to Desktop Console via WebSocket
  function sendFrame() {
    if (!isStreaming || !ws || ws.readyState !== WebSocket.OPEN) return;

    if (video && video.videoWidth > 0 && video.videoHeight > 0) {
      // Draw live camera frame
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    }
    // Convert current canvas state to JPEG frame
    const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
    const msg = JSON.stringify({
      type: 'camera_frame',
      frame: dataUrl,
      timestamp: Date.now()
    });

    ws.send(msg);
    totalBytesSent += msg.length;
    framesSent++;

    // Update telemetry
    txCounter.textContent = `${Math.round(totalBytesSent / 1024)} KB`;

    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fpsCounter.textContent = framesSent;
      framesSent = 0;
      lastFpsTime = now;

      // Send ping for RTT measurement
      ws.send(JSON.stringify({ type: 'ping', clientTime: now }));
    }
  }

  // 5. Flip Camera
  function flipCamera() {
    facingMode = (facingMode === 'environment') ? 'user' : 'environment';
    initCamera();
  }

  // 6. Torch / Flashlight Toggle
  async function toggleTorch() {
    if (!videoTrack) return;
    try {
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (caps.torch) {
        torchActive = !torchActive;
        await videoTrack.applyConstraints({ advanced: [{ torch: torchActive }] });
        showToast(torchActive ? 'Flashlight ON' : 'Flashlight OFF');
        document.getElementById('torch-btn').style.color = torchActive ? 'var(--yellow)' : '#fff';
      } else {
        showToast('Torch not supported on this lens');
      }
    } catch (e) {
      showToast('Torch unavailable');
    }
  }

  // Lifecycle Boot
  window.addEventListener('DOMContentLoaded', () => {
    initCamera();
    connectWebSocket();
  });
</script>
</body>
</html>
