version: '3.8'

services:
  securox-soc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securox-soc-core
    ports:
      - "8000:8000"
    environment:
      - SECUROX_ENV=production
      - PORT=8000
      - TELEMETRY_SPEED=2.0
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./backend/database:/app/backend/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/assets"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
